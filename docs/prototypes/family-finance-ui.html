h3,
h4,

b,

}

.table :is(th, td):last-child {

}

}

.table thead th {

}

  corner-shape: superellipse(1.5);
  color: var(--card-foreground);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  top: 0;
  left: 0;
  width: max-content;

    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)

  background: var(--popover);

  pointer-events: none;

  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {

  font-weight: var(--font-weight-medium);

}

}

.sr-only {

        root.querySelector(&#x27;[data-top-account-adjust]&#x27;).classList.toggle(&#x27;fl-is-hidden&#x27;, name !== &#x27;account-detail&#x27;);

      }
      function setEntryType(type) {
        currentEntryType = type;
        root.querySelectorAll(&#x27;[data-entry-type]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-active&#x27;, button.dataset.entryType === type));

        root.querySelector(&#x27;[data-transfer-fields]&#x27;).classList.toggle(&#x27;fl-is-hidden&#x27;, type !== &#x27;transfer&#x27;);

      function updateAdvanceMode(mode) {

        root.querySelector(&#x27;[data-advance-theirs-amount]&#x27;).classList.toggle(&#x27;fl-is-hidden&#x27;, mine);
        root.querySelector(&#x27;[data-advance-shared-toggle-row]&#x27;).classList.toggle(&#x27;fl-is-hidden&#x27;, !mine);

        }
      }
      function currencyLabel(code) {
